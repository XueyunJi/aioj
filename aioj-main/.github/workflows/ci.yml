name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm run typecheck:react
      - run: npm run test:auth
      - run: npm run build:user:react
      - run: npm run build:admin:react

  backend:
    name: Maven full test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f backend/pom.xml test

  policy:
    name: Repository and deployment policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate local Markdown links
        run: node scripts/ci/check-markdown-links.mjs
      - name: Validate repository hygiene
        run: node scripts/ci/check-repository-hygiene.mjs
      - name: Validate source-build Compose
        run: docker compose --env-file .env.example -f deploy/compose.yml config --quiet
      - name: Validate image-only production Compose
        run: >-
          docker compose
          --env-file deploy/env/production.env.example
          --env-file deploy/env/deploy.env.example
          -f deploy/compose.production.yml
          config --quiet
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
