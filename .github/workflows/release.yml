name: Release images and deploy

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      matrix: ${{ steps.release.outputs.matrix }}
      base_tag: ${{ steps.release.outputs.base_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='${{ github.event.release.tag_name }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == "v0.1.6" ]]; then
            printf 'base_tag=v0.1.5\n' >> "$GITHUB_OUTPUT"
            printf 'matrix={"include":[{"service":"web-user","dockerfile":"deploy/docker/web.Dockerfile","build_args":"APP_WORKSPACE=@aioj/web-user-react\\nAPP_DIR=web-user-react\\nVITE_API_BASE_URL=/api"}]}\n' >> "$GITHUB_OUTPUT"
          else
            printf 'base_tag=\n' >> "$GITHUB_OUTPUT"
            printf 'matrix={"include":[{"service":"gateway","dockerfile":"deploy/docker/backend.Dockerfile","build_args":"SERVICE_MODULE=gateway-service"},{"service":"auth","dockerfile":"deploy/docker/backend.Dockerfile","build_args":"SERVICE_MODULE=auth-service"},{"service":"problem","dockerfile":"deploy/docker/backend.Dockerfile","build_args":"SERVICE_MODULE=problem-service"},{"service":"ai","dockerfile":"deploy/docker/backend.Dockerfile","build_args":"SERVICE_MODULE=ai-service"},{"service":"judge-worker","dockerfile":"deploy/docker/backend.Dockerfile","build_args":"SERVICE_MODULE=judge-worker"},{"service":"sandbox","dockerfile":"deploy/sandbox/Dockerfile","build_args":""},{"service":"web-user","dockerfile":"deploy/docker/web.Dockerfile","build_args":"APP_WORKSPACE=@aioj/web-user-react\\nAPP_DIR=web-user-react\\nVITE_API_BASE_URL=/api"},{"service":"web-admin","dockerfile":"deploy/docker/web.Dockerfile","build_args":"APP_WORKSPACE=@aioj/web-admin-react\\nAPP_DIR=web-admin-react\\nVITE_API_BASE_URL=/api"}]}\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./aioj-main
          file: aioj-main/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/xueyunji/aioj-${{ matrix.service }}:${{ needs.validate.outputs.tag }}
            ghcr.io/xueyunji/aioj-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/xueyunji/aioj-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Write immutable image fragment
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p fragments
          jq -n \
            --arg service '${{ matrix.service }}' \
            --arg image 'ghcr.io/xueyunji/aioj-${{ matrix.service }}' \
            --arg digest '${{ steps.build.outputs.digest }}' \
            '{service:$service,image:$image,digest:$digest}' \
            > "fragments/${{ matrix.service }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.service }}
          path: fragments/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Publish release manifest
    needs: [validate, build]
    runs-on: ubuntu-24.04
    outputs:
      manifest_sha: ${{ steps.assets.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Load unchanged images from base release
        if: needs.validate.outputs.base_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_TAG: ${{ needs.validate.outputs.base_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p manifest-fragments base-release
          gh release download "$BASE_TAG" \
            --pattern image-manifest.json \
            --pattern image-manifest.json.sha256 \
            --dir base-release
          (cd base-release && sha256sum --check image-manifest.json.sha256)
          jq -r '.images | to_entries[] | select(.key != "web-user") | [.key, (.value | split("@")[0]), (.value | split("@")[1])] | @tsv' \
            base-release/image-manifest.json |
            while IFS=$'\t' read -r service image digest; do
              jq -n \
                --arg service "$service" \
                --arg image "$image" \
                --arg digest "$digest" \
                '{service:$service,image:$image,digest:$digest}' \
                > "manifest-fragments/$service.json"
            done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: manifest-fragments
          merge-multiple: true
      - id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-out
          tar -czf release-out/deployment-bundle.tar.gz \
            -C aioj-main deploy/compose.production.yml deploy/env scripts/deploy
          bundle_sha=$(sha256sum release-out/deployment-bundle.tar.gz | awk '{print $1}')
          node aioj-main/scripts/release/assemble-manifest.mjs \
            manifest-fragments "$TAG" "$GITHUB_SHA" "$bundle_sha" \
            release-out/image-manifest.json
          (cd release-out && sha256sum image-manifest.json > image-manifest.json.sha256)
          manifest_sha=$(sha256sum release-out/image-manifest.json | awk '{print $1}')
          printf 'manifest_sha=%s\n' "$manifest_sha" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" \
            release-out/image-manifest.json \
            release-out/image-manifest.json.sha256 \
            release-out/deployment-bundle.tar.gz \
            --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-out/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to production
    needs: [validate, manifest]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Invoke restricted deployment gate
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TAG: ${{ needs.validate.outputs.tag }}
          MANIFEST_SHA: ${{ needs.manifest.outputs.manifest_sha }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/aioj-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/aioj-deploy" "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh -T \
              -i "$HOME/.ssh/aioj-deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -o UpdateHostKeys=no \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o HostKeyAlias=aioj_a \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "aioj-deploy@$DEPLOY_HOST" \
              "deploy $TAG $MANIFEST_SHA"; then
              exit 0
            else
              status=$?
            fi
            if [[ $status -ne 56 || $attempt -eq 5 ]]; then
              exit "$status"
            fi
            delay=$((attempt * 15))
            printf 'Release asset download was interrupted; retrying deployment gate in %ss (attempt %s/5).\n' \
              "$delay" "$attempt"
            sleep "$delay"
          done
